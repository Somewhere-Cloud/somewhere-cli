# Sole CLI publisher. Tags are not publication triggers.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current master commit (40 lowercase hex characters)
        required: true
        type: string
      expected_version:
        description: Exact package version (canonical SemVer)
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm trusted publishing: @somewhere-cloud/cli <- Somewhere-Cloud/somewhere-cli publish.yml, no environment.

concurrency:
  group: somewhere-cli-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Inline trusted workflow code runs before any candidate checkout.
      - name: Authenticate trigger and immutable source
        id: trigger
        uses: actions/github-script@v7
        with:
          script: |
            const official = 'Somewhere-Cloud/somewhere-cli';
            if (`${context.repo.owner}/${context.repo.repo}` !== official) throw new Error('untrusted repository');
            let source;
            let version = '';
            if (context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/master') {
              source = context.payload.inputs.source_sha;
              version = context.payload.inputs.expected_version;
              if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?![\s\S])/.test(version)) throw new Error('invalid expected version');
            } else throw new Error('untrusted trigger');
            if (!/^[0-9a-f]{40}(?![\s\S])/.test(source)) throw new Error('invalid source SHA');
            if (context.sha !== source) throw new Error('workflow OIDC source differs from candidate');
            const master = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
            if (master.data.commit.sha !== source) throw new Error('stale source');
            core.setOutput('source', source);
            core.setOutput('version', version);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.trigger.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.19.0
      - name: Pin automatic expected version
        id: candidate
        env:
          SOURCE_SHA: ${{ steps.trigger.outputs.source }}
          EXPECTED_VERSION: ${{ steps.trigger.outputs.version }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import { validateCandidate } from "./scripts/publish-release.mjs"; const version = process.env.EXPECTED_VERSION || JSON.parse(fs.readFileSync("package.json", "utf8")).version; validateCandidate(process.env.SOURCE_SHA, version); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
      - name: Check identity before gates
        id: before
        env:
          SOURCE_SHA: ${{ steps.trigger.outputs.source }}
          EXPECTED_VERSION: ${{ steps.candidate.outputs.version }}
        run: node scripts/publish-release.mjs check "$SOURCE_SHA" "$EXPECTED_VERSION"
      - run: npm ci
      - run: npm run build
      - name: Recheck identity immediately before publication
        id: final
        env:
          SOURCE_SHA: ${{ steps.trigger.outputs.source }}
          EXPECTED_VERSION: ${{ steps.candidate.outputs.version }}
        run: node scripts/publish-release.mjs check "$SOURCE_SHA" "$EXPECTED_VERSION"
      - name: Publish once with provenance
        id: publication
        if: steps.final.outputs.mode == 'release'
        env:
          # First-version bootstrap only (npm cannot trust a package that does not exist).
          # Remove this bootstrap credential requirement when trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CLOUD_BOOTSTRAP_TOKEN }}
          # Repository variable, unset by default. 1 = stage the first version for a
          # maintainer 2FA approval instead of publishing it (stage-only token).
          FIRST_VERSION_STAGE: ${{ vars.NPM_FIRST_VERSION_STAGE }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_CLOUD_BOOTSTRAP_TOKEN is required for bootstrap" >&2; exit 1; fi
          if [ "$FIRST_VERSION_STAGE" = "1" ]; then
            npm stage publish --provenance --access public
            echo "staged=true" >> "$GITHUB_OUTPUT"
            echo "Staged, not published: approve with npm stage approve (2FA), then dispatch this workflow to verify." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --provenance --access public
          fi
      - name: Verify published registry source, SRI and Sigstore
        id: verification
        if: always() && steps.final.outcome == 'success' && steps.publication.outputs.staged != 'true' && (steps.final.outputs.mode == 'in-sync' || steps.publication.outcome == 'success' || steps.publication.outcome == 'failure')
        env:
          SOURCE_SHA: ${{ steps.final.outputs.published_head }}
          EXPECTED_VERSION: ${{ steps.candidate.outputs.version }}
        run: node scripts/publish-release.mjs verify "$SOURCE_SHA" "$EXPECTED_VERSION"
